<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:" />
    <title>Nova aba</title>
    <link rel="stylesheet" href="pages.css" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <main>
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3l4 4.5h8L20 3v9a8 8 0 0 1-16 0z" /><circle cx="9" cy="12" r="1.3" fill="var(--bg)" /><circle cx="15" cy="12" r="1.3" fill="var(--bg)" /></svg>
        <h1>Kitty</h1>
      </div>
      <p id="private-note" hidden>
        Janela privativa: o Kitty não salva seu histórico, cookies nem dados de sites desta janela. Ao fechá-la, tudo é apagado.
      </p>

      <section class="stats">
        <div class="stat">
          <strong id="blocked">0</strong>
          <span>anúncios e rastreadores bloqueados</span>
        </div>
        <div class="stat">
          <strong id="saved">0 s</strong>
          <span>de tempo economizado</span>
        </div>
      </section>

      <section id="recent" class="recent" hidden></section>
    </main>
    <script src="newtab.js"></script>
  </body>
</html>
