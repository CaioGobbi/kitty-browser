<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:" />
    <title>Senhas</title>
    <link rel="stylesheet" href="pages.css" />
    <link rel="stylesheet" href="history.css" />
    <link rel="stylesheet" href="bookmarks.css" />
    <link rel="stylesheet" href="passwords.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Senhas</h1>
        <a class="button" href="kitty://settings#senhas">Configurações</a>
      </header>
      <p id="note"></p>
      <p id="unavailable" class="warn" hidden>Este computador não oferece a criptografia do sistema agora, então o Kitty não salva senhas novas.</p>
      <input id="filter" type="search" placeholder="Pesquisar senhas" spellcheck="false" />
      <div id="list"></div>
      <p id="empty" hidden>Nenhuma senha salva ainda. Quando você entrar num site, o Kitty pergunta se quer guardar a senha.</p>
      <section id="never-section" hidden>
        <h2>Nunca salvar nestes sites</h2>
        <div id="never"></div>
      </section>
    </main>
    <script src="passwords.js"></script>
  </body>
</html>
