<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3d2b63" />
      <stop offset="1" stop-color="#140f1d" />
    </linearGradient>
    <linearGradient id="fur" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffc06e" />
      <stop offset="0.5" stop-color="#ff7a45" />
      <stop offset="1" stop-color="#ee4470" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.45" />
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16" />
      <stop offset="0.5" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" />
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" />
  </g>
  <g clip-path="url(#squircle)">
    <circle cx="512" cy="560" r="400" fill="url(#glow)" />
    <!-- a few stars -->
    <g fill="#fff">
      <circle cx="220" cy="230" r="5" opacity="0.7" />
      <circle cx="808" cy="270" r="4" opacity="0.55" />
      <circle cx="770" cy="180" r="3" opacity="0.4" />
      <circle cx="190" cy="420" r="3" opacity="0.4" />
      <circle cx="840" cy="470" r="3.5" opacity="0.5" />
    </g>
    <rect x="100" y="100" width="824" height="824" fill="url(#shine)" />
  </g>

  <!-- Cat head (shield-shaped, like the in-app logo) -->
  <path
    d="M262 248 L388 386 H636 L762 248 V528 A250 250 0 0 1 262 528 Z"
    fill="url(#fur)" stroke="url(#fur)" stroke-width="56" stroke-linejoin="round" />
  <!-- inner ears -->
  <path d="M300 330 L352 392 H300 Z" fill="#fff" opacity="0.22" stroke="#fff" stroke-opacity="0.22" stroke-width="18" stroke-linejoin="round" />
  <path d="M724 330 L672 392 H724 Z" fill="#fff" opacity="0.22" stroke="#fff" stroke-opacity="0.22" stroke-width="18" stroke-linejoin="round" />

  <!-- eyes -->
  <g fill="#1c1329">
    <ellipse cx="418" cy="548" rx="46" ry="56" />
    <ellipse cx="606" cy="548" rx="46" ry="56" />
  </g>
  <g fill="#fff">
    <circle cx="434" cy="528" r="15" />
    <circle cx="622" cy="528" r="15" />
  </g>

  <!-- nose + mouth -->
  <path d="M490 626 H534 L512 650 Z" fill="#1c1329" stroke="#1c1329" stroke-width="12" stroke-linejoin="round" />
  <path d="M512 656 Q500 684 474 680 M512 656 Q524 684 550 680" fill="none" stroke="#1c1329" stroke-width="10" stroke-linecap="round" />

  <!-- whiskers -->
  <g stroke="#fff" stroke-opacity="0.75" stroke-width="9" stroke-linecap="round">
    <path d="M360 632 L250 616" />
    <path d="M362 660 L256 676" />
    <path d="M664 632 L774 616" />
    <path d="M662 660 L768 676" />
  </g>
</svg>
